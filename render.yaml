databases:
  - name: cb-analyzer-db
    databaseName: cb_analyzer_db
    user: cb_analyzer_db_user
    plan: free
    region: singapore

services:
  - type: web
    name: cb-analyzer
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate --noinput && gunicorn cbsite.wsgi:application
    healthCheckPath: /healthz/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: cb-analyzer-db
          property: connectionString
